<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#b9d9f4">

  <title>Ayla | Baile de Inverno Encantado</title>

  <link rel="stylesheet" href="style.css?v=10">
</head>

<body>

  <main id="convite">

    <!-- IMAGEM DAS PORTAS NÍTIDAS -->
    <img
      id="portas"
      src="imagens/portas.png"
      alt="Portas do palácio encantado"
    >

    <!-- IMAGEM CONGELADA QUE SERÁ LIMPA -->
    <canvas id="vidro"></canvas>

    <!-- INSTRUÇÃO -->
    <div id="instrucao">

    </div>

    <!-- VÍDEO CINEMATOGRÁFICO -->

      id="video"
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="abertura.mp4" type="video/mp4">
    </video>

  </main>

  <script src="script.js?v=10"></script>

</body>
</html>
